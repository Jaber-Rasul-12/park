<script>
$(document).ready(function() {
    var cart = [];
    var productData = {};

    // جمع بيانات المنتجات
    $('.product-card').each(function() {
        var card = $(this);
        var id = card.data('product-id');
        productData[id] = {
            name: card.data('product-name'),
            price: parseFloat(card.data('product-price')) || 0,
            priceId: card.data('price-id') || null
        };
    });

    // ====== التحكم بالكمية ======
    $(document).on('click', '.qty-minus', function(e) {
        e.stopPropagation();
        var id = $(this).data('id');
        var input = $('#qty_' + id);
        var val = parseInt(input.val()) || 1;
        if (val > 1) input.val(val - 1);
    });

    $(document).on('click', '.qty-plus', function(e) {
        e.stopPropagation();
        var id = $(this).data('id');
        var input = $('#qty_' + id);
        var val = parseInt(input.val()) || 0;
        if (val < 99) input.val(val + 1);
    });

    // ====== إضافة للسلة ======
    $(document).on('click', '.btn-add-to-cart', function(e) {
        e.stopPropagation();
        var id = $(this).data('id');
        var qtyInput = $('#qty_' + id);
        var qty = parseInt(qtyInput.val()) || 1;
        
        if (qty <= 0) {
            showToast('الكمية غير صحيحة', 'error');
            return;
        }

        addToCart(id, qty);
        qtyInput.val(1);
    });

    // ====== النقر على البطاقة ======
    $(document).on('click', '.product-card', function(e) {
        if ($(e.target).closest('.btn-add-to-cart').length || $(e.target).closest('.qty-control').length) {
            return;
        }
        
        var id = $(this).data('product-id');
        var qtyInput = $('#qty_' + id);
        var qty = parseInt(qtyInput.val()) || 1;
        
        addToCart(id, qty);
        qtyInput.val(1);
        
        $(this).css('transform', 'scale(0.95)');
        setTimeout(function() {
            $(this).css('transform', '');
        }.bind(this), 200);
    });

    // ====== دالة الإضافة للسلة ======
    function addToCart(productId, quantity) {
        var product = productData[productId];
        if (!product) {
            showToast('المنتج غير موجود', 'error');
            return;
        }

        if (product.price <= 0) {
            showToast('هذا المنتج ليس له سعر نشط', 'error');
            return;
        }

        var existing = cart.find(function(item) {
            return item.id === productId;
        });
        
        if (existing) {
            existing.qty += quantity;
        } else {
            cart.push({
                id: productId,
                name: product.name,
                price: product.price,
                priceId: product.priceId,
                qty: quantity
            });
        }

        updateCart();
        showToast('✅ تم إضافة ' + quantity + ' × ' + product.name, 'success');
    }

    // ====== تحديث السلة ======
    function updateCart() {
        var cartItems = $('#cartItems');
        var cartCount = $('#cartCount');
        var totalAmount = $('#totalAmount');
        var checkoutBtn = $('#checkoutBtn');

        if (cart.length === 0) {
            cartItems.html(`
                <div class="empty-cart">
                    <span>🛍️</span>
                    <p>السلة فارغة</p>
                    <small>اختر المنتجات من الأعلى</small>
                </div>
            `);
            cartCount.text('0');
            totalAmount.text('0.00 ر.س');
            checkoutBtn.prop('disabled', true);
            return;
        }

        var html = '';
        var total = 0;
        var itemCount = 0;

        $.each(cart, function(index, item) {
            var subtotal = item.price * item.qty;
            total += subtotal;
            itemCount += item.qty;

            html += `
                <div class="cart-item" data-product-id="${item.id}">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-details">${item.price.toFixed(2)} ر.س × ${item.qty}</div>
                    </div>
                    <div class="cart-item-actions">
                        <div class="cart-item-qty">
                            <button class="cart-qty-minus" data-id="${item.id}">−</button>
                            <span class="cart-qty-number">${item.qty}</span>
                            <button class="cart-qty-plus" data-id="${item.id}">+</button>
                        </div>
                        <span class="cart-item-price">${subtotal.toFixed(2)}</span>
                        <button class="cart-item-remove" data-id="${item.id}">×</button>
                    </div>
                </div>
            `;
        });

        cartItems.html(html);
        cartCount.text(itemCount);
        totalAmount.text(total.toFixed(2) + ' ر.س');
        checkoutBtn.prop('disabled', false);
    }

    // ====== تحديث الكمية في السلة ======
    $(document).on('click', '.cart-qty-minus', function(e) {
        e.stopPropagation();
        var productId = $(this).data('id');
        var item = cart.find(function(i) {
            return i.id === productId;
        });
        if (!item) return;

        item.qty -= 1;
        
        if (item.qty <= 0) {
            cart = cart.filter(function(i) {
                return i.id !== productId;
            });
            showToast('❌ تم إزالة المنتج', 'error');
        }

        updateCart();
    });

    $(document).on('click', '.cart-qty-plus', function(e) {
        e.stopPropagation();
        var productId = $(this).data('id');
        var item = cart.find(function(i) {
            return i.id === productId;
        });
        if (!item) return;

        if (item.qty < 99) {
            item.qty += 1;
            updateCart();
        } else {
            showToast('⚠️ الحد الأقصى 99 قطعة', 'error');
        }
    });

    // ====== إزالة منتج ======
    $(document).on('click', '.cart-item-remove', function(e) {
        e.stopPropagation();
        var productId = $(this).data('id');
        var item = cart.find(function(i) {
            return i.id === productId;
        });
        
        if (!item) return;
        
        cart = cart.filter(function(i) {
            return i.id !== productId;
        });
        updateCart();
        showToast('❌ تم إزالة المنتج', 'error');
    });

    // ====== مسح السلة ======
    $('#clearCart').on('click', function() {
        if (cart.length === 0) {
            showToast('⚠️ السلة فارغة بالفعل', 'error');
            return;
        }
        
        cart = [];
        updateCart();
        showToast('🗑️ تم مسح السلة بالكامل', 'error');
    });

    // ====== إنشاء وطباعة فاتورة ======
    $('#checkoutBtn').on('click', function() {
        if (cart.length === 0) {
            showToast('السلة فارغة! أضف منتجات أولاً', 'error');
            return;
        }

        var invoiceData = {
            items: cart.map(function(item) {
                return {
                    product_id: item.id,
                    product_name: item.name,
                    price_id: item.priceId,
                    quantity: item.qty,
                    price: item.price,
                    subtotal: item.price * item.qty
                };
            }),
            total: cart.reduce(function(sum, item) {
                return sum + (item.price * item.qty);
            }, 0)
        };

    // ====== طباعة الإيصالات واحداً تلو الآخر ======
function printReceiptsOneByOne(receipts, index) {
    if (index >= receipts.length) {
        showToast('✅ تم طباعة جميع الإيصالات', 'success');
        return;
    }
    
    var receiptHtml = receipts[index];
    var total = receipts.length;
    var current = index + 1;
    
    // ====== فتح نافذة جديدة ======
    var printWindow = window.open('', '_blank', 'width=400,height=600,scrollbars=yes,resizable=yes');
    
    if (!printWindow) {
        showToast('❌ يرجى السماح للنوافذ المنبثقة', 'error');
        return;
    }
    
    // ====== كتابة الإيصال في النافذة ======
    printWindow.document.write(receiptHtml);
    printWindow.document.close();
    
    // ====== طباعة تلقائية عند تحميل الصفحة ======
    printWindow.onload = function() {
        setTimeout(function() {
            printWindow.print();
        }, 500);
    };
    
    // ====== بعد الانتهاء من الطباعة ======
    printWindow.onafterprint = function() {
        setTimeout(function() {
            printWindow.close();
            // ====== طباعة الإيصال التالي ======
            printReceiptsOneByOne(receipts, index + 1);
        }, 1000);
    };
    
    // ====== في حال إغلاق النافذة يدوياً ======
    printWindow.onclose = function() {
        // استمر في طباعة الباقي
        setTimeout(function() {
            printReceiptsOneByOne(receipts, index + 1);
        }, 1000);
    };
}

    // ====== عرض رسالة ======
    function showToast(message, type) {
        type = type || 'success';
        var toast = $('<div>')
            .addClass('toast ' + type)
            .text(message);
        
        $('body').append(toast);
        
        setTimeout(function() {
            toast.css('opacity', '0');
            toast.css('transform', 'translateY(20px)');
            setTimeout(function() {
                toast.remove();
            }, 300);
        }, 2500);
    }

    // ====== اختصارات ======
    $(document).on('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            $('#checkoutBtn').click();
        }
        if (e.key === 'Escape') {
            if (cart.length > 0) {
                $('#clearCart').click();
            }
        }
    });

    function updateTitle() {
        var count = cart.reduce(function(sum, item) {
            return sum + item.qty;
        }, 0);
        
        if (count > 0) {
            document.title = '(' + count + ') 🛒 نقطة البيع';
        } else {
            document.title = '🧾 نقطة البيع';
        }
    }

    var originalUpdateCart = updateCart;
    updateCart = function() {
        originalUpdateCart();
        updateTitle();
    };
});
