fields:
    product:
        label: 'jaber.player::lang.model.price.product'
        span: auto
        type: relation
        select: name
        placeholder: jaber.player::lang.plugin.select
    price:
        label: 'jaber.player::lang.model.price.price'
        span: auto
        type: number
    status:
        label: 'jaber.player::lang.model.price.status'
        span: auto
        type: switch
    _logbook@update:
            type: jacob_logbook_log
            limitPerPage: 10 
            startPage: 1 
            permissions: log_changes_player
            showUndoChangesButton: true 
            refreshFormAfterUndo: true 